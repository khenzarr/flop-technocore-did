[project]
name = "technocore-agent-local"
version = "0.2.0"
description = "Windows-local, operator-approved Technocore DID signer"
requires-python = ">=3.12"
dependencies = ["cryptography==50.0.0"]

[project.scripts]
technocore-trusted-test-service = "technocore_agent.service.entrypoint:main"
technocore-agent-local = "technocore_agent.service.entrypoint:main"
technocore-agent-init = "technocore_agent.service.local_init:main"
technocore-agent-identity = "technocore_agent.service.identity_recovery:main"
technocore-draft-client = "technocore_agent.service.client:main"
technocore-agent-operator-init = "technocore_agent.service.operator_init:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/technocore_agent"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.1", "ty>=0.0.71", "coverage>=7.15.4", "build>=1.2.2"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
[tool.ty.environment]
root = ["src"]
